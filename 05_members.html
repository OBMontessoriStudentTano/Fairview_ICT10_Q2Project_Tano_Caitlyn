<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2Q Drill2</title>
     <link rel="stylesheet" 
    href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" 
    src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    
     <style>

        body {
            font-family: Georgia, 'Times New Roman', Times, serif;
            background-image: url(https://i.pinimg.com/736x/68/46/bd/6846bdb097e410e13c9ffe794c928814.jpg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            box-sizing: border-box;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: stretch;
        }

        .navbar {
            display: flex;
            justify-content: flex-end;
            gap: 25px;
            align-items: center;
            flex-direction: row;
            width: 100%;
            padding: 10px 20px;
            justify-content: flex-end;
            margin: 0;
            background-color: rgba(225,228,196,0.75);
            box-sizing: border-box;
        }

        .navbar a {
            text-decoration: none;
            color: #25301f;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 15px;
            border-radius: 10px;
            white-space: nowrap;
        }

        .navbar a:hover {
            color: white;
            border-radius: 10px;
        }

        .add {
            width: 850px;
            max-width: 90%;
            min-height: 350px;
            margin: 30px auto;
            background-color: rgba(225,228,196,0.75);
            padding: 45px;
            border-radius: 20px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.20);
            box-sizing: border-box;
            backdrop-filter: blur(5px);
            align-self: center;
        }

        h1 {
            color: #25301f;
            margin-bottom: 5px;
            font-size: 32px;
            letter-spacing: 1px;
        }

        h2 {
            color: #20301f;
            font-weight: normal;
            font-style: italic;
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 16px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            background-color: bisque;
            border: 1px solid #7af092;
            border-bottom: 2px solid #aab896;
            border-radius: 0;
            font-size: 15px;
            color: #2a3025
        }

        input:focus {
            outline: none;
            border: 2px solid #6aa332
        }

        button {
            margin-top: 15px;
            padding: 12px 35px;
            background-color: #f59fcb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            letter-spacing: 1px;
        }

        button:hover {
            background-color: #a3325d;
        }

        #message {
            margin-top: 25px;
            font-size: 16px;
            font-weight: bold;
            line-height: 1.5;
        }

        #members {
            text-align: left;
            line-height: 1.8;
            color: #301f28
        }

        #members p {
            text-align: center;
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px solid rgba(37,48,31,0.25);
        }

    </style>
</head>
<body>

    <nav class="navbar">
        <a href="01_homepage.html">Homepage</a>
        <a href="03_elements.html">Element Checker</a>
        <a href="07_creator.html">Meet the Creator</a>
    </nav>

    <br><br><br><br>

     <div class="add">

    <h1>Add New Communication Arts Club Members</h1>
    <br>

    <input type="text" id="text1" placeholder="Enter your first name">
    <br>

    <input type="text" id="text2" placeholder="Enter your last name">
    <br><br>

    <button type="button" py-click="enter">Submit</button>
    <br>

    <p id="message"></p>

    <div id="box" style="display: none;">

        <h2>List of Members</h2>
        
        <div id="members"></div>
    </div>

    </div>

    <script type="py" src="06_members.py"></script>
    
</body>
</html>
