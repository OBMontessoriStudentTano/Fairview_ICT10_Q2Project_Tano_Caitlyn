<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2Q Project</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>
</head>
<body>

    <!--Card containing the About Me description and Calculator-->
    <div class="card">

     <!--About Me section-->
    <div class="h2">
    <h2>About me</h2>
    </div>

     <!--Displays information from Python-->
    <div class="info">
    <div>My name is <span id="name"></span></div>
    <div>My age is <span id="age"></span></div>
    <div>My height (in cm) is <span id="height"></span></div>
    <div>Three countries I already visited are <span id="countries"></span></div>
    <div>I'm a new student: <span id="student"></span></div>
    <div>My favorite types of things: <span id="favorite"></span></div>
    <div>My favorite fruits are: <span id="fruits"></span></div>
    <div>Here are the seven days of the week: <span id="weeks"></span></div>
    </div>
    
</body>
</html>
